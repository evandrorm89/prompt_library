<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Prompt Library</h1>
      <p class="subtitle">Save, organize, and reuse your favorite prompts.</p>
    </header>

    <section class="card">
      <form id="prompt-form" class="prompt-form">
        <div class="field">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Blog post outline"
            maxlength="80"
            required
          />
        </div>

        <div class="field">
          <label for="content">Prompt</label>
          <textarea
            id="content"
            name="content"
            rows="5"
            placeholder="Write your prompt here…"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save prompt</button>
      </form>
    </section>

    <section class="library">
      <div class="library-head">
        <h2>Saved prompts</h2>
        <span id="count" class="count">0</span>
      </div>
      <div id="prompt-list" class="prompt-list"></div>
      <p id="empty-state" class="empty-state">
        No prompts yet. Add one above to get started.
      </p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
