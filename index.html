<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1><span class="prompt-symbol">&gt;_</span> Prompt Library</h1>
      <p class="subtitle">Save and organize your favorite prompts</p>
    </header>

    <form id="prompt-form" class="prompt-form">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Refactor helper" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="5" placeholder="Write your prompt here..." required></textarea>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input type="text" id="model" name="model" placeholder="e.g. claude-opus-4-8" maxlength="100" autocomplete="off" required>
      </div>
      <button type="submit" class="btn-save">Save Prompt</button>
      <p id="form-error" class="form-error" role="alert"></p>
    </form>

    <section class="library">
      <div class="library-head">
        <h2>Saved Prompts</h2>
        <div class="toolbar">
          <button type="button" id="export-btn" class="btn-tool">Export</button>
          <button type="button" id="import-btn" class="btn-tool">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </div>
      <p id="io-status" class="io-status" role="status" aria-live="polite"></p>
      <div id="prompt-list" class="prompt-list"></div>
      <p id="empty-state" class="empty-state">No prompts saved yet. Add one above.</p>
    </section>
  </div>

  <!-- Conflict-resolution dialog, shown when an import overlaps existing ids. -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title" class="modal-title"></h3>
      <p id="modal-body" class="modal-body"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="metadata.js"></script>
  <script src="exportImport.js"></script>
  <script src="app.js"></script>
</body>
</html>
